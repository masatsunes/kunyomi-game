<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直訳訓読みクイズ</title>
    <!-- Tailwind CSS をCDNから読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* カスタムアニメーションの定義 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pulseSoft {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.5; }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .animate-bounce-in {
            animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-pulse-soft {
            animation: pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* フォント設定 (モダンなゴシック体を指定) */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-orange-50 flex flex-col items-center justify-center p-4 selection:bg-orange-200">

    <main id="app-container" class="w-full max-w-md bg-[#faf9f6] rounded-[2rem] shadow-2xl p-6 md:p-8 min-h-[500px] flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300">
        <!-- JSによってコンテンツがここに描画されます -->
    </main>

    <footer class="mt-8 text-center text-sm font-medium text-orange-300">
        Kun'yomi Jukugo Quiz © 2026
    </footer>

    <script>
        // クイズのデータ
        const QUIZ_DATA = [
            { kunyomi: "あまくに", jukugo: "天国" },
            { kunyomi: "かななき", jukugo: "悲鳴" },
            { kunyomi: "まどほし", jukugo: "惑星" },
            { kunyomi: "たえのぞみ", jukugo: "絶望" },
            { kunyomi: "はこびいのち", jukugo: "運命" },
            { kunyomi: "おやとも", jukugo: "親友" },
            { kunyomi: "くらくろ", jukugo: "暗黒" },
            { kunyomi: "ふとひ", jukugo: "太陽" },
            { kunyomi: "あいやしろ", jukugo: "会社" },
            { kunyomi: "よみふみ", jukugo: "読書" }
        ];

        // アプリケーションの状態
        let gameState = 'start'; // 'start', 'playing', 'result'
        let currentIndex = 0;
        let score = 0;
        let feedback = null; // 'correct', 'incorrect', null

        const appContainer = document.getElementById('app-container');

        // SVGアイコンの定義（外部依存をなくすためインライン化）
        const icons = {
            book: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
            play: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
            check: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
            x: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
            chevronRight: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`,
            rotate: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 3"></polyline><path d="M3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-16 3z" opacity="0"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L3 10"></path><polyline points="3 4 3 10 9 10"></polyline></svg>`
        };

        // 描画を更新するメイン関数
        function render() {
            appContainer.innerHTML = ''; // クリア
            
            if (gameState === 'start') {
                appContainer.innerHTML = renderStartScreen();
            } else if (gameState === 'playing') {
                appContainer.innerHTML = renderPlayingScreen();
                
                // 描画後に入力欄にフォーカスを当てる
                if (feedback === null) {
                    const input = document.getElementById('user-input');
                    if (input) input.focus();
                }
            } else if (gameState === 'result') {
                appContainer.innerHTML = renderResultScreen();
            }
        }

        // スタート画面のHTML
        function renderStartScreen() {
            return `
                <div class="flex flex-col items-center justify-center space-y-8 animate-fade-in text-center w-full">
                    <div class="bg-orange-100 p-6 rounded-full shadow-inner mb-4 text-orange-500 drop-shadow-md">
                        ${icons.book}
                    </div>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 tracking-tight">
                        直訳訓読みクイズ
                    </h1>
                    <p class="text-gray-600 font-medium leading-relaxed max-w-xs">
                        漢字をすべて「訓読み」に変換しました。<br/>
                        元の熟語が何か推理して当てよう！<br/>
                        <span class="text-sm text-gray-400 mt-2 block">(例：あまくに → 天国)</span>
                    </p>
                    <button 
                        onclick="startGame()"
                        class="group relative flex items-center justify-center gap-2 w-full max-w-xs py-4 px-6 bg-gradient-to-r from-orange-400 to-orange-500 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl hover:scale-105 transition-all active:scale-95"
                    >
                        ${icons.play}
                        ゲームスタート
                    </button>
                </div>
            `;
        }

        // プレイ画面のHTML
        function renderPlayingScreen() {
            const currentQ = QUIZ_DATA[currentIndex];
            
            let feedbackHtml = '';
            let formHtml = '';

            if (feedback === null) {
                // 回答前
                formHtml = `
                    <form onsubmit="checkAnswer(event)" class="flex flex-col gap-4 w-full">
                        <input
                            id="user-input"
                            type="text"
                            placeholder="漢字で入力してね"
                            class="w-full text-center text-2xl py-4 px-6 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-orange-400 focus:bg-white transition-colors placeholder:text-gray-300"
                            autocomplete="off"
                        />
                        <button
                            type="submit"
                            class="w-full py-4 rounded-2xl bg-gray-800 text-white font-bold text-lg shadow-md hover:bg-gray-700 transition-colors active:scale-95"
                        >
                            回答する
                        </button>
                    </form>
                `;
            } else {
                // 回答後
                const isCorrect = feedback === 'correct';
                const colorClass = isCorrect ? 'text-green-500' : 'text-red-500';
                const icon = isCorrect ? icons.check : icons.x;
                const message = isCorrect ? '大正解！' : '残念！';
                
                const btnText = currentIndex < QUIZ_DATA.length - 1 ? '次の問題へ' : '結果を見る';

                formHtml = `
                    <div class="flex flex-col gap-4 w-full">
                        <input
                            type="text"
                            value="${document.getElementById('user-input') ? document.getElementById('user-input').value : ''}"
                            disabled
                            class="w-full text-center text-2xl py-4 px-6 bg-gray-100 border-2 border-gray-200 rounded-2xl opacity-70"
                        />
                    </div>
                `;

                feedbackHtml = `
                    <div class="mt-6 flex flex-col items-center animate-bounce-in w-full">
                        <div class="flex items-center gap-2 text-2xl font-black mb-4 ${colorClass}">
                            ${icon} ${message}
                        </div>
                        ${!isCorrect ? `
                            <div class="text-gray-600 font-medium mb-6">
                                正解は <span class="text-xl font-bold text-gray-900 mx-1">${currentQ.jukugo}</span> です
                            </div>
                        ` : '<div class="mb-6"></div>'}
                        <button
                            onclick="nextQuestion()"
                            class="flex items-center justify-center gap-2 w-full py-4 rounded-2xl bg-orange-500 text-white font-bold text-lg shadow-lg hover:bg-orange-600 transition-colors active:scale-95"
                        >
                            ${btnText}
                            ${icons.chevronRight}
                        </button>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col w-full animate-fade-in flex-grow">
                    <!-- Progress header -->
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-sm font-bold text-gray-400 bg-gray-100 px-3 py-1 rounded-full">
                            第 ${currentIndex + 1} / ${QUIZ_DATA.length} 問
                        </span>
                        <span class="text-sm font-bold text-orange-500 bg-orange-50 px-3 py-1 rounded-full border border-orange-100">
                            スコア: ${score}
                        </span>
                    </div>

                    <!-- Question Display -->
                    <div class="flex flex-col items-center justify-center bg-white p-8 rounded-3xl shadow-sm border-2 border-orange-100 mb-8 min-h-[160px]">
                        <span class="text-sm text-orange-500 font-bold mb-2">元の熟語は何？</span>
                        <h2 class="text-4xl md:text-5xl font-black text-gray-800 tracking-widest break-keep">
                            「${currentQ.kunyomi}」
                        </h2>
                    </div>

                    <!-- Input & Form -->
                    ${formHtml}

                    <!-- Feedback Section -->
                    ${feedbackHtml}
                </div>
            `;
        }

        // 結果画面のHTML
        function renderResultScreen() {
            let message = "";
            if (score === QUIZ_DATA.length) message = "完璧！あなたは直訳マスターです！🏆";
            else if (score >= 7) message = "すごい！発想力が豊かですね！✨";
            else if (score >= 4) message = "ナイスファイト！次はもっといけるはず！👍";
            else message = "頭の体操になりましたね！もう一度挑戦しよう！💪";

            let effectHtml = score === QUIZ_DATA.length 
                ? `<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-yellow-200 to-orange-100 opacity-30 animate-pulse-soft"></div>` 
                : '';

            return `
                <div class="flex flex-col items-center justify-center text-center animate-fade-in w-full">
                    <h2 class="text-2xl font-bold text-gray-500 mb-2">クイズ終了！</h2>
                    <div class="bg-white p-8 rounded-3xl shadow-sm border-2 border-orange-100 w-full mb-8 relative overflow-hidden">
                        ${effectHtml}
                        <p class="text-gray-600 font-medium mb-4 relative z-10">あなたの正答数は...</p>
                        <div class="text-6xl font-black text-gray-800 mb-6 relative z-10">
                            <span class="text-orange-500">${score}</span>
                            <span class="text-3xl text-gray-400 mx-1">/</span>
                            <span class="text-4xl text-gray-400">${QUIZ_DATA.length}</span>
                        </div>
                        <p class="text-lg font-bold text-orange-600 relative z-10">${message}</p>
                    </div>
                    
                    <button 
                        onclick="startGame()"
                        class="flex items-center justify-center gap-2 w-full max-w-xs py-4 px-6 bg-gray-800 text-white font-bold rounded-2xl shadow-lg hover:bg-gray-700 hover:scale-105 transition-all active:scale-95"
                    >
                        ${icons.rotate}
                        もう一度遊ぶ
                    </button>
                </div>
            `;
        }

        // イベントハンドラー群 (HTMLのonclickなどから呼ばれる)
        window.startGame = function() {
            gameState = 'playing';
            currentIndex = 0;
            score = 0;
            feedback = null;
            render();
        };

        window.checkAnswer = function(event) {
            event.preventDefault(); // フォームの送信を防ぐ
            
            const inputEl = document.getElementById('user-input');
            const userAnswer = inputEl.value.trim();
            
            if (!userAnswer) return; // 空なら何もしない

            const currentQ = QUIZ_DATA[currentIndex];
            
            if (userAnswer === currentQ.jukugo) {
                score++;
                feedback = 'correct';
            } else {
                feedback = 'incorrect';
            }
            
            // フィードバック表示のため再描画
            render();
        };

        window.nextQuestion = function() {
            if (currentIndex < QUIZ_DATA.length - 1) {
                currentIndex++;
                feedback = null;
                render();
            } else {
                gameState = 'result';
                render();
            }
        };

        // 初期描画
        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
